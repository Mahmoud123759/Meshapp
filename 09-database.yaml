---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: meshapp-db
  namespace: meshapp
  labels:
    app: meshapp-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meshapp-db
  template:
    metadata:
      labels:
        app: meshapp-db
    spec:
      containers:
        - name: meshapp-db
          image: postgres:15-alpine
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "password"
            - name: POSTGRES_DB
              value: "meshapp_db"
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: meshapp-db
  namespace: meshapp
  labels:
    app: meshapp-db
spec:
  selector:
    app: meshapp-db
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
