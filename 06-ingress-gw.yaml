---
# =============================================================================
# MeshForge — ingress-gw  (Tier 1, edge entry point)
# =============================================================================
# The single public-facing entry point. The load generator hits this service.
# Downstream call chain: ingress-gw → aggregator → processor → storage-a/b
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshapp-ingress-gw
  namespace: meshapp
  labels:
    app: meshapp-ingress-gw
    app.kubernetes.io/name: meshapp-ingress-gw
    app.kubernetes.io/part-of: meshapp
    app.kubernetes.io/version: "1.0.0"
    tier: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meshapp-ingress-gw
  template:
    metadata:
      labels:
        app: meshapp-ingress-gw
        app.kubernetes.io/name: meshapp-ingress-gw
        app.kubernetes.io/part-of: meshapp
        tier: edge
      annotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portNumber: "3000"
        k8s.grafana.com/metrics.path: "/metrics"
        k8s.grafana.com/job: "meshapp/meshapp-ingress-gw"
    spec:
      containers:
        - name: meshapp-ingress-gw
          image: node:22-alpine
          command: ["/bin/sh", "/startup/startup.sh"]
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "meshapp-ingress-gw"
            - name: PORT
              value: "3000"
            - name: PYROSCOPE_SERVER
              value: "http://pyroscope.monitoring.svc.cluster.local:4040"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "alloy.monitoring.svc.cluster.local:4317"
            - name: DOWNSTREAM_SERVICES
              value: "meshapp-aggregator.meshapp.svc.cluster.local:3000"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: STRESS_LATENCY_MS
              value: "0"
            - name: STRESS_ERROR_RATE
              value: "0"
            - name: STRESS_CPU_BURN_MS
              value: "0"
          resources:
            requests:
              cpu: 30m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: app-code
              mountPath: /app
            - name: startup
              mountPath: /startup
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 300
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 300
            periodSeconds: 15
      volumes:
        - name: app-code
          configMap:
            name: meshapp-node-code
        - name: startup
          configMap:
            name: meshapp-startup
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: meshapp-ingress-gw
  namespace: meshapp
  labels:
    app: meshapp-ingress-gw
    app.kubernetes.io/name: meshapp-ingress-gw
    app.kubernetes.io/part-of: meshapp
    tier: edge
  annotations:
    k8s.grafana.com/scrape: "true"
    k8s.grafana.com/metrics.portNumber: "3000"
    k8s.grafana.com/metrics.path: "/metrics"
    k8s.grafana.com/job: "meshapp/meshapp-ingress-gw"
spec:
  selector:
    app: meshapp-ingress-gw
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
