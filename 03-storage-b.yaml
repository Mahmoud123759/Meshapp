---
# =============================================================================
# MeshForge — storage-b  (Tier 4, leaf node B)
# =============================================================================
# Second leaf storage node. Processor fans out to both storage-a AND storage-b
# so you get parallel downstream spans in Tempo's service graph.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meshapp-storage-b
  namespace: meshapp
  labels:
    app: meshapp-storage-b
    app.kubernetes.io/name: meshapp-storage-b
    app.kubernetes.io/part-of: meshapp
    app.kubernetes.io/version: "1.0.0"
    tier: storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meshapp-storage-b
  template:
    metadata:
      labels:
        app: meshapp-storage-b
        app.kubernetes.io/name: meshapp-storage-b
        app.kubernetes.io/part-of: meshapp
        tier: storage
      annotations:
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portNumber: "3000"
        k8s.grafana.com/metrics.path: "/metrics"
        k8s.grafana.com/job: "meshapp/storage-b"
    spec:
      containers:
        - name: meshapp-storage-b
          image: 345259854056.dkr.ecr.us-east-1.amazonaws.com/meshapp:latest
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: "meshapp-storage-b"
            - name: PORT
              value: "3000"
            - name: PYROSCOPE_SERVER
              value: "http://pyroscope.monitoring.svc.cluster.local:4040"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://alloy.monitoring.svc.cluster.local:4317"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: STRESS_LATENCY_MS
              value: "0"
            - name: STRESS_ERROR_RATE
              value: "0"
            - name: STRESS_CPU_BURN_MS
              value: "0"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: rds-creds
                  key: host
            - name: DB_USER
              
              valueFrom:
                secretKeyRef:
                  name: rds-creds
                  key: username
            - name: DB_PASSWORD
              
              valueFrom:
                secretKeyRef:
                  name: rds-creds
                  key: password
            - name: DB_NAME
              value: "dev_db"
          resources:
            requests:
              cpu: 20m
              memory: 512Mi
            limits:
              cpu: 150m
              memory: 512Mi
  
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: meshapp-storage-b
  namespace: meshapp
  labels:
    app: meshapp-storage-b
    app.kubernetes.io/name: meshapp-storage-b
    app.kubernetes.io/part-of: meshapp
    tier: storage
  annotations:
    k8s.grafana.com/scrape: "true"
    k8s.grafana.com/metrics.portNumber: "3000"
    k8s.grafana.com/metrics.path: "/metrics"
    k8s.grafana.com/job: "meshapp/storage-b"
spec:
  selector:
    app: meshapp-storage-b
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  type: ClusterIP
